                </p>

<div class="flex justify-between items-center pb-stack-sm border-b border-surface-container-high mb-stack-sm">

<!-- Interactive script for slight movement -->
<script>
        // Micro-interaction for the summary card on load
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.bg-surface-container-lowest');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 300);
        });
    </script>

<!-- Contextual Information Card (Floating Style) -->
<section class="px-margin-mobile pb-12 pt-4 max-w-md mx-auto w-full">
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl flex items-start gap-4">
<div class="bg-primary-fixed p-2 rounded-lg">
<span class="material-symbols-outlined text-on-primary-fixed">security</span>
</div>
<div class="text-left">
<h3 class="font-label-lg text-label-lg text-on-surface">Privasi Terjamin</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Data lokasi hanya digunakan untuk layanan pengiriman dan tidak dibagikan ke pihak ketiga.</p>
</div>
</div>
</section>
<script>
        // Micro-interaction for the primary button
        const primaryBtn = document.querySelector('button.bg-\\[\\#2d8a5e\\]');
        if (primaryBtn) {
            primaryBtn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                icon.textContent = 'hourglass_empty';
                icon.classList.add('animate-spin');
                this.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">hourglass_empty</span> Memproses...`;
                
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                    icon.textContent = 'check_circle';
                    this.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span> Akses Diberikan`;
                    this.classList.replace('bg-[#2d8a5e]', 'bg-secondary-container');
                    this.classList.replace('text-white', 'text-on-secondary-container');
                }, 1500);
            });
        }
    </script>
</body></html>

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar - Pendaftaran Akun -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-sm">
<div class="flex items-center justify-between px-margin-mobile h-touch-target w-full max-w-md mx-auto">
<button class="flex items-center justify-center w-touch-target h-touch-target hover:bg-surface-container-high transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Pendaftaran Akun</h1>
<div class="w-touch-target"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto pt-20 pb-32 px-margin-mobile">
<!-- Step Progress Indicator -->
<nav class="flex items-center justify-between mb-stack-lg relative px-2">
<!-- Progress Line Background -->
<div class="absolute top-4 left-0 w-full h-[2px] bg-outline-variant -z-10 mx-margin-mobile"></div>
<!-- Step 1: Active -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-label-lg ring-4 ring-primary-fixed">1</div>
<span class="text-label-sm font-semibold text-primary">Data Diri</span>
</div>
<!-- Step 2: Inactive -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold text-label-lg">2</div>
<span class="text-label-sm font-medium text-on-surface-variant">Kontak</span>
</div>
<!-- Step 3: Inactive -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold text-label-lg">3</div>
<span class="text-label-sm font-medium text-on-surface-variant">Lokasi</span>
</div>
</nav>
<!-- Intro Section -->
<section class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Halo, Mari Berkenalan!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Lengkapi data diri kamu untuk mulai terhubung dengan tetangga.</p>
</section>
<!-- Form Section -->
<div class="space-y-stack-md">
<!-- Illustration Placeholder -->
<div class="w-full h-48 rounded-xl overflow-hidden mb-stack-md bg-surface-container-low flex items-center justify-center relative">
<div class="absolute inset-0 opacity-20 step-gradient"></div>
<img class="w-full h-full object-cover" data-alt="A warm, hand-drawn style illustration showing two diverse neighbors waving at each other across a white picket fence. The style is cozy and minimalist with a limited palette of soft forest greens and warm terracottas. Soft, diffused daylight creates a welcoming, neighborhood atmosphere in line with the Guyub brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfOTp08Ufm-BCULTeWaeyoXOZsTfMskmR7nmuRdKm7S_MsBpaD9NnLoYiZS0SPJbq8-fAjyG00KD9zXo6WyNgfbv3ZNi9IH7LININfHrPgIVrgJKZXadRhRLZBPambADgXw0_hk3ajwIKg2O0h_Pc_vjFofPMhM0Qw7LE4S6xSsnzR-Q7Is9EFV6kbsVbSXc1Aqic5tJiCAqBKI1nLllTSlMcoS2wh8NTuHimCtR0gmSWtMQ8zb3wnrw"/>
</div>
<!-- Input Nama Lengkap -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="full_name">Nama Lengkap</label>
<div class="relative group">
<input class="w-full h-12 px-4 rounded-xl border border-outline-variant bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-md text-on-surface placeholder:text-outline" id="full_name" placeholder="Contoh: Ahmad Hidayat" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">person</span>
</div>
</div>
<!-- Additional Context (Organic Pattern) -->
<div class="p-stack-md rounded-xl bg-secondary-fixed text-on-secondary-fixed-variant flex items-start gap-3 mt-stack-md">
<span class="material-symbols-outlined text-secondary">info</span>
<p class="font-label-sm text-label-sm leading-relaxed">
                    Nama ini akan digunakan tetangga untuk mengenalimu di forum warga Guyub.
                </p>
</div>
</div>
</main>
<!-- Footer Action - BottomNavBar Style with Lanjutkan Button -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface-container-lowest dark:bg-surface-container-lowest shadow-[0_-4px_12px_rgba(0,0,0,0.05)] px-gutter-mobile py-4 rounded-t-xl">
<div class="max-w-md mx-auto w-full flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full h-touch-target bg-primary text-on-primary rounded-xl font-headline-md text-headline-md font-bold shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Lanjutkan
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Bottom Secondary Nav Links -->
<div class="flex justify-around items-center pt-2">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-opacity active:opacity-80">
<span class="material-symbols-outlined mb-1">help_outline</span>
<span class="font-label-sm text-label-sm">Bantuan</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-opacity active:opacity-80">
<span class="material-symbols-outlined mb-1">description</span>
<span class="font-label-sm text-label-sm">Syarat &amp; Ketentuan</span>
</button>
</div>
</div>
</footer>
<script>
        // Simple micro-interaction for input highlight
        const inputField = document.getElementById('full_name');
        inputField.addEventListener('focus', () => {
            inputField.parentElement.classList.add('scale-[1.01]');
        });
        inputField.addEventListener('blur', () => {
            inputField.parentElement.classList.remove('scale-[1.01]');
        });

        // Form submission logic (UI only)
        const continueBtn = document.querySelector('button.bg-primary');
        continueBtn.addEventListener('click', () => {
            if(!inputField.value.trim()) {
                inputField.classList.add('border-error');
                inputField.classList.add('animate-shake');
                setTimeout(() => inputField.classList.remove('animate-shake'), 500);
            } else {
                continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                setTimeout(() => {
                    alert('Melanjutkan ke Langkah 2: Kontak');
                    continueBtn.innerHTML = 'Lanjutkan <span class="material-symbols-outlined">arrow_forward</span>';
                }, 800);
            }
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</body></html>

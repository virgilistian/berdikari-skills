        // Micro-interactions and subtle scroll effects
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md', 'glass-card');
                header.classList.remove('bg-surface');
            } else {
                header.classList.remove('shadow-md', 'glass-card');
                header.classList.add('bg-surface');
            }
        });

        // Logout confirmation mock
        document.querySelector('button.text-error').addEventListener('click', () => {
            if(confirm('Yakin ingin keluar dari akun Guyub kamu?')) {
                alert('Berhasil keluar. Sampai jumpa lagi, Tetangga!');
            }
        });

        // Click effects for list items
        document.querySelectorAll('button.group').forEach(btn => {
            btn.addEventListener('click', function() {
                const label = this.querySelector('span:not(.material-symbols-outlined)').innerText;
                console.log(`Navigating to: ${label}`);
            });
        });
    </script>

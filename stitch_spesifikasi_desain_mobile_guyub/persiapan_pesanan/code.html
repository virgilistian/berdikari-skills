<div class="flex flex-col">

</div>
</div>
<!-- Menu List Card -->

<div class="w-16 h-16 rounded-lg bg-cover bg-center flex-shrink-0" data-alt="A close-up high-definition shot of authentic Indonesian Nasi Goreng Spesial with a sunny-side-up egg on top, served on a traditional plate. The lighting is warm and inviting, highlighting the steam rising from the rice. The color palette features rich earthy browns and bright yellows, maintaining a welcoming neighborhood kitchen aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAS-1bHNUCgsyoQypN_zZoM08DSDPbmahhduiwx79s6sRBBkZdjGQlMnHr7HvRmSkzGXS06XRgc90qrzffVqd0drB5GjSCX3-29Ds2Q__sD65YoJAH00Nz_Qb9N6iVWhxGQvgt1B3wRh3_6ddHYOcl-pn-YXf6DtlDPaPpeCahbFUnw234b3TE4sKmqOUhR1brRfa5WgtoLSFMMMzZ9BRb9wNsOASyUuaIsgw5fS_cPd6YvTwkOXnW7xw')">

<span class="material-symbols-outlined text-primary">check_circle</span>
</label>

</div>

</div>
<script>
        // Simple logic for the checkboxes to update item styles (visual only)
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const text = this.closest('label').querySelector('span.font-headline-md');
                const status = this.closest('label').querySelector('span.font-label-sm');
                const icon = this.closest('label').querySelector('.material-symbols-outlined:last-child');
                
                if (this.checked) {
                    text.classList.add('line-through', 'decoration-on-surface-variant/50');
                    status.textContent = 'Sudah Siap';
                    status.classList.replace('text-secondary', 'text-primary');
                    icon.textContent = 'check_circle';
                    icon.classList.replace('text-outline-variant', 'text-primary');
                } else {
                    text.classList.remove('line-through', 'decoration-on-surface-variant/50');
                    status.textContent = 'Sedang Disiapkan';
                    status.classList.replace('text-primary', 'text-secondary');
                    icon.textContent = 'radio_button_unchecked';
                    icon.classList.replace('text-primary', 'text-outline-variant');
                }
            });
        });
    </script>

<style>
        body {
            background-color: #fbf9f8;
            color: #1b1c1c;
            -webkit-tap-highlight-color: transparent;
        }

<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-40 bg-background flex items-center px-margin-mobile h-touch-target">
<button class="w-touch-target h-touch-target flex items-center justify-center -ml-2 text-primary hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-md text-headline-md text-primary">Daftar Akun</h1>
</header>
<main class="flex-1 mt-touch-target px-margin-mobile pb-stack-lg overflow-y-auto max-w-md mx-auto w-full">
<!-- Illustration Section -->
<div class="pt-stack-lg pb-stack-md flex justify-center">
<div class="w-full aspect-[16/9] rounded-xl overflow-hidden shadow-sm relative bg-surface-container-low">
<img class="w-full h-full object-cover" data-alt="A warm and inviting digital illustration of a local Indonesian neighborhood market or Pangkalan scene. The style is 'handmade' and organic with soft textures and a Corporate Modern touch. The scene features a small colorful stall with local snacks, lush tropical plants in clay pots, and a friendly, relaxed atmosphere. The color palette uses deep greens, warm earth tones, and soft whites to match the Guyub Narrative brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3qFYsoV6tb0HyVsKXLWTxhS9nDmuVW0dST7z7smdGduMPyKDSMmbIumgGqWLqns58OEnUeXlLm1_3kPFhe9PZGje2tg1qbc6H7Ph5ARQkS2USWqZebI2-HZz2ENmwDL2-QrWROCu3tQj58h0ThQcGulSJPiZzBfHXuGi2rbO2xirEuA-s11xUK-edAD0wCvTf5llWX1RDKl0fnLWjhHby2jO5m4SAGoOhxypAoXRvfOmN6pDOrsZ8Aw"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/40 to-transparent"></div>
</div>
</div>
<!-- Headline Section -->
<div class="space-y-2 mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-background">Masuk ke Akun</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Masuk kembali untuk melanjutkan pesananmu, Tetangga!</p>
</div>
<!-- Login Form -->
<form class="space-y-stack-md" onsubmit="return false;">
<!-- Phone Field -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="phone">Nomor Handphone</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-outline material-symbols-outlined" data-icon="phone">phone</span>
<input class="w-full h-touch-target pl-11 pr-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="phone" placeholder="0812xxxx" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-outline material-symbols-outlined" data-icon="lock">lock</span>
<input class="w-full h-touch-target pl-11 pr-11 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-2 w-touch-target h-touch-target flex items-center justify-center text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Lupa Password?</a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-md">
<button class="w-full h-touch-target bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-md hover:bg-primary-container active:scale-95 transition-all duration-150 flex items-center justify-center gap-2" type="submit">
                    Masuk Sekarang
                </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-stack-lg text-center pb-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? 
                <a class="text-primary font-label-lg hover:underline transition-all" href="#">Daftar di sini</a>
</p>
</div>
</main>
<!-- Micro-interaction Scripts -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Add subtle animation on input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#006a42';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#6f7a71';
            });
        });
    </script>

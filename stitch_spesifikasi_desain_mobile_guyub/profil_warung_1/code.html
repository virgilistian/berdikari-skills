<script>
        // Micro-interaction for the Save Button
        const saveBtn = document.getElementById('save-btn');
        saveBtn.addEventListener('click', () => {
            const originalContent = saveBtn.innerHTML;
            saveBtn.innerHTML = `
                <span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span>
                Menyimpan...
            `;
            saveBtn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                saveBtn.innerHTML = `
                    <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    Berhasil Disimpan
                `;
                saveBtn.classList.remove('bg-primary');
                saveBtn.classList.add('bg-primary-container');
                
                setTimeout(() => {
                    saveBtn.innerHTML = originalContent;
                    saveBtn.classList.remove('bg-primary-container', 'opacity-80', 'pointer-events-none');
                    saveBtn.classList.add('bg-primary');
                }, 2000);
            }, 1200);
        });

        // Toggle functionality visual feedback
        document.querySelectorAll('.ios-toggle').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const row = this.closest('.p-4');
                const inputs = row.querySelectorAll('input[type="time"]');
                const spacer = row.querySelector('.text-on-surface-variant');
                
                if (this.checked) {
                    inputs.forEach(i => {
                        i.classList.remove('opacity-50', 'pointer-events-none');
                    });
                    if (spacer) spacer.classList.remove('opacity-50');
                } else {
                    inputs.forEach(i => {
                        i.classList.add('opacity-50', 'pointer-events-none');
                    });
                    if (spacer) spacer.classList.add('opacity-50');
                }
            });
        });

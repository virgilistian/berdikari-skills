<body class="bg-black/90 selection:bg-primary-container selection:text-on-primary-container antialiased overflow-hidden">
<!-- Modal Layout Wrapper -->
<div class="relative w-full h-screen flex flex-col items-center justify-center">
<!-- TopAppBar Navigation -->
<!-- Based on COMPONENT_229 logic: bg-black/60, close icon, download action -->
<header class="fixed top-0 left-0 w-full z-[100] flex justify-between items-center px-margin-mobile h-touch-target bg-black/60 transition-opacity duration-200">
<button class="material-symbols-outlined text-on-primary p-2 transition-opacity duration-200 active:scale-95 hover:bg-white/10 rounded-full" data-icon="close">
                close
            </button>
<div class="flex gap-2">
<button class="material-symbols-outlined text-on-primary p-2 transition-opacity duration-200 active:scale-95 hover:bg-white/10 rounded-full" data-icon="share">
                    share
                </button>
<button class="material-symbols-outlined text-on-primary p-2 transition-opacity duration-200 active:scale-95 hover:bg-white/10 rounded-full" data-icon="download">
                    download
                </button>
</div>
</header>
<!-- Main Content: High-Resolution Receipt -->
<main class="w-full h-full flex items-center justify-center overflow-auto p-4 md:p-8 receipt-zoom-container">
<div class="relative max-w-full max-h-full transition-transform duration-300 ease-out origin-center" id="receipt-wrapper">
<img alt="Struk Transaksi Guyub" class="shadow-2xl rounded-lg max-h-[85vh] w-auto object-contain cursor-zoom-in" id="receipt-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClz0uDWfQVDdpqefLKRMGeLD5TcRl2pqAO18jF8C0qw7sZuA6WRswkJD-kUFK76hNG851aFmNZhVjxGwzngIgWPVxlGUMCh6nMeoHz3Gxk8OU9X8dOCptCk-AutAbxWFeKblv1kywMnwb5ZDvv4TktHlTETaUguxnSOIUPOuxLEOs80ypysjNlv_X6R1oxS2Uyls-FKrpxtKpFrWtoDW-yXYzSU7w2JziPXezrIaFgyYGMTBWJ2wbBnQ"/>
</div>
</main>
<!-- Visual Cue: Pinch to Zoom -->
<div class="fixed bottom-12 flex justify-center w-full pointer-events-none px-margin-mobile">
<div class="bg-black/40 backdrop-blur-md border border-white/10 px-4 py-2 rounded-full flex items-center gap-2 animate-bounce">
<span class="material-symbols-outlined text-on-primary text-[18px]" style="font-variation-settings: 'FILL' 0;">zoom_in</span>
<span class="font-label-sm text-label-sm text-on-primary">Cubit untuk perbesar</span>
</div>
</div>
<!-- Background Atmospheric Element (Subtle Gradient) -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-black via-transparent to-black opacity-40"></div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('receipt-img');
            const wrapper = document.getElementById('receipt-wrapper');
            let scale = 1;
            let initialDist = 0;

            // Simple micro-interaction for visual feedback on click/tap
            img.addEventListener('click', () => {
                if (scale === 1) {
                    scale = 1.5;
                    img.style.cursor = 'zoom-out';
                } else {
                    scale = 1;
                    img.style.cursor = 'zoom-in';
                }
                wrapper.style.transform = `scale(${scale})`;
            });

            // Native pinch-to-zoom is supported by 'touch-action: pinch-zoom' on the container,
            // but we can add a simple drag behavior for mobile if needed.
            // For this high-fidelity prototype, we rely on browser-level high-res rendering.
        });

        // Close action simulation
        const closeBtn = document.querySelector('[data-icon="close"]');
        closeBtn.addEventListener('click', () => {
            // Visual exit animation
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
                console.log('Closing Modal...');
                // In a real app, this would trigger navigation back or window.history.back()
            }, 300);
        });
    </script>

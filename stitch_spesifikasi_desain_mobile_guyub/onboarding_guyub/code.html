<script>
        // Simple Interaction logic for button feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Future navigation logic would go here
                console.log('Button clicked:', this.innerText);
            });
        });

        // Atmospheric Micro-interaction: Mouse parallax for blobs
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blob-bg');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>

<script>
        const track = document.getElementById('carouselTrack');
        const dots = document.querySelectorAll('.dot');
        const nextBtn = document.getElementById('nextBtn');
        const nextBtnText = document.getElementById('nextBtnText');
        const skipBtn = document.getElementById('skipBtn');
        
        let currentSlide = 0;
        const totalSlides = 3;

        function updateCarousel() {
            // Slide transition
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Dot updates
            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.remove('w-2', 'bg-outline-variant');
                    dot.classList.add('w-6', 'bg-primary');
                } else {
                    dot.classList.remove('w-6', 'bg-primary');
                    dot.classList.add('w-2', 'bg-outline-variant');
                }
            });

            // Button text updates
            if (currentSlide === totalSlides - 1) {
                nextBtnText.textContent = 'Mulai Belanja';
                skipBtn.style.opacity = '0';
                skipBtn.style.pointerEvents = 'none';
            } else {
                nextBtnText.textContent = 'Selanjutnya';
                skipBtn.style.opacity = '1';
                skipBtn.style.pointerEvents = 'auto';
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateCarousel();
            } else {
                // Final action
                alert('Selamat datang di GUYUB!');
            }
        });

        skipBtn.addEventListener('click', () => {
            currentSlide = totalSlides - 1;
            updateCarousel();
        });

        // Touch handling (Simple Swipe)
        let touchStartX = 0;
        let touchEndX = 0;

        track.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        track.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) { // Swipe Left
                if (currentSlide < totalSlides - 1) {
                    currentSlide++;
                    updateCarousel();
                }
            }
            if (touchEndX > touchStartX + 50) { // Swipe Right
                if (currentSlide > 0) {
                    currentSlide--;
                    updateCarousel();
                }
            }
        }
    </script>

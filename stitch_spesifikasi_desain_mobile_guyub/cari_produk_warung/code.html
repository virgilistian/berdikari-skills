<script>
        // Simple micro-interaction for clearing input
        const searchInput = document.querySelector('input');
        const clearBtn = document.querySelector('[data-icon="close"]');
        
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
        });

        // Search history removal simulation
        document.querySelectorAll('section:first-of-type button[data-icon="close"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const row = e.target.closest('.flex.items-center.justify-between');
                row.classList.add('scale-95', 'opacity-0');
                setTimeout(() => row.remove(), 200);
            });
        });

        // Handle focus states and input interactions
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;

        });

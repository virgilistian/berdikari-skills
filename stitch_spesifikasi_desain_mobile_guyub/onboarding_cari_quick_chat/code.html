<script>
        // Micro-interaction for the illustration entrance
        document.addEventListener('DOMContentLoaded', () => {
            const illustration = document.querySelector('section img');
            if (illustration) {
                illustration.style.opacity = '0';
                illustration.style.transform = 'translateY(10px)';
                illustration.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                
                setTimeout(() => {
                    illustration.style.opacity = '1';
                    illustration.style.transform = 'translateY(0)';
                }, 100);
            }
        });
    </script>

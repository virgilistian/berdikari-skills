<div class="space-y-3">
<!-- Day Row Template -->
<script>
                    const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
                    document.write(days.map((day, index) => `
                        <div class="bg-surface-container-lowest p-4 rounded-xl border border-surface-container flex flex-col gap-4">
                            <div class="flex items-center justify-between">
                                <span class="font-label-lg text-label-lg text-on-surface">${day}</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" class="sr-only peer switch-input" ${index < 5 ? 'checked' : ''}>
                                    <div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer transition-colors switch-bg">
                                        <div class="absolute top-[2px] left-[2px] bg-white border-gray-300 border rounded-full h-5 w-5 transition-all switch-dot"></div>
                                    </div>
                                    <span class="ml-3 text-sm font-medium text-on-surface-variant">${index < 5 ? 'Buka' : 'Tutup'}</span>
                                </label>
                            </div>
                            
                            <div class="flex items-center justify-between gap-2 ${index >= 5 ? 'opacity-30 pointer-events-none' : ''}">
                                <!-- Time Picker Input: Open -->
                                <div class="flex-1 space-y-1">
                                    <label class="text-[10px] uppercase font-bold tracking-widest text-outline block pl-1">Jam Buka</label>
                                    <div class="flex items-center justify-between px-3 h-11 bg-surface-container-low rounded-lg border border-outline-variant hover:border-primary active:ring-1 active:ring-primary transition-all">
                                        <span class="font-body-md text-on-surface">08:00</span>
                                        <span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
                                    </div>
                                </div>
                                
                                <div class="text-on-surface-variant font-body-md pt-5 px-1 self-center">sampai</div>
                                
                                <!-- Time Picker Input: Close -->
                                <div class="flex-1 space-y-1">
                                    <label class="text-[10px] uppercase font-bold tracking-widest text-outline block pl-1">Jam Tutup</label>
                                    <div class="flex items-center justify-between px-3 h-11 bg-surface-container-low rounded-lg border border-outline-variant hover:border-primary active:ring-1 active:ring-primary transition-all">
                                        <span class="font-body-md text-on-surface">21:00</span>
                                        <span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join(''));
                </script>

<!-- Micro-interaction JS for switches -->
<script>
        document.querySelectorAll('.switch-input').forEach(toggle => {
            toggle.addEventListener('change', (e) => {
                const label = e.target.nextElementSibling.nextElementSibling;
                const timeContainer = e.target.closest('.bg-surface-container-lowest').querySelector('.flex.items-center.justify-between.gap-2');
                
                if (e.target.checked) {
                    label.textContent = 'Buka';
                    timeContainer.classList.remove('opacity-30', 'pointer-events-none');
                } else {
                    label.textContent = 'Tutup';
                    timeContainer.classList.add('opacity-30', 'pointer-events-none');
                }
            });
        });
    </script>

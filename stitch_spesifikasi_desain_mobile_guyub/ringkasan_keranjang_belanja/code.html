<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('bottomSheet');
            const overlay = document.getElementById('overlay');
            const closeBtn = document.querySelector('button span[data-icon="close"]')?.parentElement || document.querySelector('button span.material-symbols-outlined:contains("close")')?.parentElement;

            // Simple close animation logic
            const closeSheet = () => {
                sheet.style.transform = 'translateY(100%)';
                overlay.style.opacity = '0';
                setTimeout(() => {
                    // Logic to actually hide would go here in a real app
                }, 400);
            };

            // Touch interaction logic placeholder
            let startY = 0;
            sheet.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            });

            sheet.addEventListener('touchmove', (e) => {
                const currentY = e.touches[0].clientY;
                const deltaY = currentY - startY;
                if (deltaY > 0) {
                    sheet.style.transform = `translateY(${deltaY}px)`;
                }
            });

            sheet.addEventListener('touchend', (e) => {
                const endY = e.changedTouches[0].clientY;
                if (endY - startY > 150) {
                    closeSheet();
                } else {
                    sheet.style.transform = 'translateY(0)';
                }
            });
        });
    </script>

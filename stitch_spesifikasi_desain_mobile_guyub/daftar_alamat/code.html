<!-- Interaction Script -->
<script>
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', (e) => {
                // Micro-interaction logic for ripple or specific state changes can go here
                console.log('Action triggered:', el.ariaLabel || el.innerText || 'Interaction');
            });
        });

        // Simple scroll behavior for header
        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            const header = document.querySelector('header');
            if (currentScroll > 10) {
                header.classList.add('shadow-md');
                header.classList.remove('shadow-none');
            } else {
                header.classList.add('shadow-none');
                header.classList.remove('shadow-md');
            }
            lastScroll = currentScroll;
        });
    </script>

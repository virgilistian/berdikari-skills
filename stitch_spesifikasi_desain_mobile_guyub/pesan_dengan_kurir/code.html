<span class="material-symbols-outlined" data-icon="send" data-weight="fill">send</span>
</button>
</div>
</div>
<!-- Hidden UI element: Navigation (Required by Protocol but Contextually Suppressed) -->
<!-- Note: BottomNavBar suppressed for focused messaging task -->
<script>
        // Micro-interactions for message behavior
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chat-messages');
            const inputField = document.querySelector('input[type="text"]');
            const sendButton = document.querySelector('button .material-symbols-outlined[data-icon="send"]').parentElement;
            const quickReplies = document.querySelectorAll('.no-scrollbar button');

            // Scroll to bottom helper
            const scrollToBottom = () => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };
            scrollToBottom();

            // Send message function
            const sendMessage = (text) => {
                if (!text.trim()) return;

                const messageDiv = document.createElement('div');
                messageDiv.className = 'flex flex-col gap-1 items-end ml-auto max-w-[85%] animate-message';
                
                const now = new Date();
                const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

                messageDiv.innerHTML = `
                    <div class="bg-primary text-on-primary-container p-3 rounded-xl bubble-right shadow-sm">
                        <p class="text-body-md font-medium">${text}</p>
                    </div>
                    <div class="flex items-center gap-1 mr-1">
                        <span class="text-[10px] text-outline">${time}</span>
                        <span class="material-symbols-outlined text-[14px] text-outline" data-icon="done">done</span>
                    </div>
                `;

                chatContainer.appendChild(messageDiv);
                scrollToBottom();
                inputField.value = '';

                // Simulate delivery
                setTimeout(() => {
                    const icon = messageDiv.querySelector('[data-icon="done"]');
                    icon.innerText = 'done_all';
                    icon.classList.remove('text-outline');
                    icon.classList.add('text-primary');
                }, 1500);
            };

            sendButton.addEventListener('click', () => sendMessage(inputField.value));
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage(inputField.value);
            });

            // Quick reply handler
            quickReplies.forEach(btn => {
                btn.addEventListener('click', () => {
                    sendMessage(btn.innerText.trim());
                });
            });
        });
    </script>

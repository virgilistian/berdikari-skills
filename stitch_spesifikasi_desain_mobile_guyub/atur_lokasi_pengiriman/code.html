<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#006c44",
                    "on-tertiary-container": "#fffbff",
                    "tertiary-fixed-dim": "#f4bb92",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "on-background": "#1b1c1c",
                    "surface": "#fbf9f8",
                    "surface-dim": "#dbd9d9",
                    "secondary": "#9f4200",
                    "on-primary": "#ffffff",
                    "secondary-container": "#ff7a2b",
                    "tertiary-fixed": "#ffdcc5",
                    "primary-container": "#258459",
                    "on-primary-fixed": "#002111",
                    "surface-variant": "#e4e2e2",
                    "on-primary-container": "#f6fff6",
                    "primary-fixed": "#9af5c1",
                    "on-tertiary-fixed-variant": "#653d1e",
                    "on-surface": "#1b1c1c",
                    "error-container": "#ffdad6",
                    "secondary-fixed-dim": "#ffb692",
                    "outline": "#6f7a71",
                    "on-secondary-fixed-variant": "#793100",
                    "primary": "#006a42",
                    "outline-variant": "#bec9bf",
                    "inverse-primary": "#7ed9a6",
                    "primary-fixed-dim": "#7ed9a6",
                    "surface-container": "#efeded",
                    "tertiary": "#7d5231",
                    "surface-container-highest": "#e4e2e2",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#3f4942",
                    "on-tertiary-fixed": "#301400",
                    "on-primary-fixed-variant": "#005232",
                    "inverse-on-surface": "#f2f0f0",
                    "background": "#fbf9f8",
                    "surface-bright": "#fbf9f8",
                    "tertiary-container": "#996a47",
                    "inverse-surface": "#303030",
                    "surface-container-low": "#f5f3f3",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#341100",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#ffdbcb",
                    "on-secondary-container": "#602500",
                    "surface-container-high": "#eae8e7"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "base": "4px",
                    "stack-sm": "8px",
                    "stack-lg": "24px",
                    "gutter-mobile": "12px",
                    "touch-target": "44px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-md": ["Plus Jakarta Sans"],
                    "price-lg": ["Plus Jakarta Sans"],
                    "body-lg": ["Inter"],
                    "label-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "price-lg": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #fbf9f8;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .marker-bounce {
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .bottom-sheet {
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            border-radius: 24px 24px 0 0;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface overflow-hidden h-screen flex flex-col">
<!-- Top Navigation & Search Bar -->
<header class="z-50 bg-surface/90 backdrop-blur-md px-margin-mobile pt-stack-lg pb-stack-md shrink-0">
<div class="flex items-center gap-stack-md">
<button class="w-touch-target h-touch-target flex items-center justify-center bg-surface-container rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex-1 relative">
<div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="w-full h-touch-target pl-11 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Cari alamat atau nama tempat" type="text"/>
</div>
</div>
</header>
<!-- Map Container (Approx 60% Height) -->
<main class="relative flex-1 min-h-[530px] overflow-hidden">
<!-- Mock Map Background -->
<div class="absolute inset-0 w-full h-full bg-surface-dim" data-alt="A detailed map view of a suburban neighborhood in Pangkalan, Tegalwaru, showing clean street layouts, soft green park areas, and minimalist building footprints. The aesthetic is modern and light, utilizing a pastel-toned cartography style with gentle greens and off-white neutrals that match the brand's 'Santai tapi pasti' philosophy. Overhead daylight provides clear, shadowless visibility across the hyper-local geography." data-location="Pangkalan Tegalwaru" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBwerzs-Dm8jWoW5PR6HenhpRsNFqziSpVFwlIvqAGdSiDZJiGUDkIXnbRphDOoxITNfi8jgdAf9Vvgbz3Ro0HwPFna3UbfzibnRRL-r_GacF6sCrNkgvCIl71R6khYSexi8fxrqp8moIrGXNgGASxm02kFQqbPnA4hEj0HIfk0yMe5n-YOB0DbY3fvtVYCMrMTc5W80dvI8308XVdBFez22YFMVaVoinPb8yeD5XyRQrP-i1adskHNMQ')">
</div>
<!-- Center Marker -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative mb-8 marker-bounce">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-1 bg-on-background/20 rounded-full blur-[2px]"></div>
</div>
</div>
<!-- Floating Action Button: Use Current Location -->
<div class="absolute bottom-stack-lg left-1/2 -translate-x-1/2 w-full px-margin-mobile flex justify-center">
<button class="flex items-center gap-stack-sm px-6 h-touch-target bg-primary text-on-primary rounded-full shadow-lg active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="font-label-lg">Gunakan Lokasi Saat Ini</span>
</button>
</div>
</main>
<!-- Recent Locations Section (Bottom Sheet Style) -->
<section class="bottom-sheet bg-surface-container-lowest pt-stack-md px-margin-mobile pb-8 relative z-50 shrink-0">
<!-- Drag Handle Indicator -->
<div class="w-12 h-1 bg-outline-variant rounded-full mx-auto mb-stack-md"></div>
<div class="mb-stack-md flex justify-between items-center">
<h2 class="font-headline-md text-on-surface">Lokasi Terakhir</h2>
<button class="text-primary font-label-lg hover:underline">Lihat Semua</button>
</div>
<div class="space-y-stack-sm">
<!-- Location Item: Home -->
<button class="w-full flex items-center gap-stack-md p-3 hover:bg-surface-container-low rounded-xl transition-colors text-left group">
<div class="w-11 h-11 flex items-center justify-center bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-full group-active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-lg text-on-surface truncate">Rumah</p>
<p class="font-body-md text-on-surface-variant truncate">Jl. Kebon Jeruk No. 12, Pangkalan</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Location Item: Office -->
<button class="w-full flex items-center gap-stack-md p-3 hover:bg-surface-container-low rounded-xl transition-colors text-left group">
<div class="w-11 h-11 flex items-center justify-center bg-secondary-fixed text-on-secondary-fixed-variant rounded-full group-active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-lg text-on-surface truncate">Kantor</p>
<p class="font-body-md text-on-surface-variant truncate">Kawasan Industri Tegalwaru, Blok C</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<!-- Location Item: Favorite (Optional/Extra) -->
<button class="w-full flex items-center gap-stack-md p-3 hover:bg-surface-container-low rounded-xl transition-colors text-left group">
<div class="w-11 h-11 flex items-center justify-center bg-surface-container-high text-on-surface-variant rounded-full group-active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">history</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-lg text-on-surface truncate">Pasar Pangkalan</p>
<p class="font-body-md text-on-surface-variant truncate">Jl. Raya Tegalwaru KM 4</p>
</div>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
<!-- Confirm Selection Button -->
<div class="mt-stack-lg">
<button class="w-full h-12 bg-primary text-on-primary rounded-xl font-label-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all">
                Konfirmasi Lokasi
            </button>
</div>
</section>
<!-- Bottom Navigation Mock (Inactive for this specific sub-page but visual context) -->
<nav class="hidden lg:flex fixed bottom-0 w-full justify-center pb-4 pointer-events-none">
<div class="bg-surface/80 backdrop-blur px-8 py-3 rounded-full shadow-lg border border-outline-variant/30 flex gap-12 pointer-events-auto">
<!-- Simplified for context -->
</div>
</nav>
<script>
        // Simple Interaction Logic
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Haptic feedback simulation
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });

        // Search Input focus effect
        const searchInput = document.querySelector('input');
        searchInput.addEventListener('focus', () => {
            document.querySelector('header').classList.add('shadow-md');
        });
        searchInput.addEventListener('blur', () => {
            document.querySelector('header').classList.remove('shadow-md');
        });
    </script>
</body></html>

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top AppBar (Transactional Shell Filter Applied: No BottomNav) -->

                Kirim Ulang Kode
            </button>
<div class="flex items-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="schedule">schedule</span>

<p class="font-label-sm text-label-sm text-on-surface-variant">
            Butuh bantuan? <a class="underline" href="#">Hubungi kami</a>
</p>

<script>
        // OTP Focus Management
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown Timer Logic
        let timeLeft = 117; // 01:57 in seconds
        const countdownElement = document.getElementById('countdown');
        const resendBtn = document.getElementById('btn-resend');

        const updateTimer = () => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            countdownElement.textContent = `Kirim ulang dalam ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                countdownElement.parentElement.classList.add('hidden');
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-outline-variant');
                resendBtn.classList.add('text-secondary');
            } else {
                timeLeft--;
            }
        };

        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        // Simple animation entry
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                main.classList.remove('opacity-0', 'translate-y-4');
                main.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-700', 'ease-out');
            }, 100);
        });
    </script>

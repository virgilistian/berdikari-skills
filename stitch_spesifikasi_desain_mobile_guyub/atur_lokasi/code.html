<style>
        body {
            background-color: #fbf9f8;
            color: #1b1c1c;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .map-container {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .map-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 10;
            pointer-events: none;
        }

        .pin-shadow {
            width: 12px;
            height: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(1px);
        }

        /* Glassmorphism subtle effect for address card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .active-scale:active {
            transform: scale(0.96);
        }

<body class="font-body-md text-body-md">
<!-- TopAppBar -->

<div class="relative animate-bounce">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="pin-shadow"></div>
</div>
</div>
<!-- Floating Action Buttons on Map (Optional utility) -->
<div class="absolute right-margin-mobile bottom-64 flex flex-col gap-base">
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-md flex items-center justify-center text-primary active-scale">
<span class="material-symbols-outlined">my_location</span>
</button>
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-md flex items-center justify-center text-on-surface-variant active-scale">

</button>
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-md flex items-center justify-center text-on-surface-variant active-scale">

</button>

<!-- BottomNavBar (Hidden on this screen as per "Task-Focused" rule) -->
<!-- It is suppressed because location selection is a focused task -->
<script>
        // Micro-interaction: Mimic map movement
        const pin = document.querySelector('.map-pin');
        let isMoving = false;

        document.querySelector('.map-container').addEventListener('mousedown', () => {
            isMoving = true;
            pin.querySelector('.animate-bounce').classList.remove('animate-bounce');
            pin.style.transform = 'translate(-50%, -110%) scale(1.1)';
            pin.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
        });

        window.addEventListener('mouseup', () => {
            if (isMoving) {
                isMoving = false;
                pin.style.transform = 'translate(-50%, -100%) scale(1)';
                setTimeout(() => {
                    pin.querySelector('div').classList.add('animate-bounce');
                }, 200);
            }
        });
    </script>

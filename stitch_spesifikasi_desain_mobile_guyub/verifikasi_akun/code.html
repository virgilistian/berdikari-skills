<div class="absolute inset-0 bg-primary-container/10 rounded-full animate-pulse"></div>

<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant rounded-xl text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 outline-none" maxlength="1" placeholder="-" type="text"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant rounded-xl text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 outline-none" maxlength="1" placeholder="-" type="text"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant rounded-xl text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 outline-none" maxlength="1" placeholder="-" type="text"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant rounded-xl text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 outline-none" maxlength="1" placeholder="-" type="text"/>

                    </button>
</div>

<!-- Additional Context (Guyub Approachable Voice) -->
<div class="mt-stack-lg pt-stack-md border-t border-surface-variant/50 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">timer</span>

<!-- Bottom Navigation Shell (Filter: Hidden on Transactional Screens as per instructions, but placeholder provided for completeness of JSON requirement) -->
<!-- Suppression logic: Verification is a focused Task/Transactional flow, hence BottomNavBar is omitted from the visible UI but logic is acknowledged. -->
<script>
        // Simple micro-interaction for OTP input movement
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown timer simulation
        let timeLeft = 119;
        const timerSpan = document.querySelector('.text-secondary');
        const interval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(interval);
                timerSpan.textContent = "00:00";
            } else {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerSpan.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>

<body class="bg-surface-bright text-on-surface flex flex-col min-h-screen antialiased">

</div>

<!-- Friendly Illustration / Icon Section -->

</div>

</div>

</div>

                </p>
</div>
<!-- Information Card (Bento Style Sub-item) -->
<div class="w-full bg-surface-container-low rounded-2xl p-4 mb-stack-lg flex items-center gap-4 text-left border border-outline-variant/30">

</div>

</button>

            </button>
</div>
<!-- Supportive Neighborhood Footer (The "Santai" Touch) -->

<p class="font-label-sm text-label-sm text-on-surface-variant/60">
                Butuh bantuan? Hubungi <span class="text-secondary font-semibold">Bantuan Guyub</span> di pojok kanan atas aplikasi kamu.
            </p>
</div>
</main>
<!-- Interactive micro-interactions -->
<script>
        // Subtle haptic-like feedback on the main button
        const mainBtn = document.querySelector('button');
        mainBtn.addEventListener('touchstart', () => {
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.blur-3xl');
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            
            blobs.forEach((blob, i) => {
                const speed = (i + 1) * 0.5;
                blob.style.transform = `translateX(${x * speed}px) translateY(${y * speed}px)`;
            });
        });
    </script>

<body class="min-h-screen flex flex-col items-center justify-start overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 bg-background flex items-center justify-between px-margin-mobile h-touch-target z-50">
<button class="transition-transform active:scale-95 hover:opacity-80 p-2 -ml-2">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background">Atur Profil</h1>
<div class="w-touch-target"></div> <!-- Spacer for center alignment -->
</header>
<main class="w-full max-w-md px-margin-mobile flex flex-col items-center pt-stack-lg flex-grow">
<!-- Profile Picture Section -->
<div class="relative group mt-4 mb-stack-lg">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container shadow-lg transition-all duration-300 group-hover:scale-105 active:scale-95 bg-surface-container-low flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A warm, bright close-up portrait of a friendly smiling person with a natural background, soft golden hour sunlight, captured in a modern corporate-soft photography style with shallow depth of field. The aesthetic is welcoming and trustworthy, featuring soft greens and earthy tones to match the neighborhood app theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuApTktbhajMPALZQ58bJNJu57m0qDkRZ2yS5cleQPDOxM2bfaVSj2KIReXw6Q5_wuHVY_hJQzr7z_13iUqaGQa8FX8zwAm2nylvnylJwaHw8Uz4IWZ7FNdO62N89YoB7sOpIvE7gliPPKqH7IZ89y_7nokcGV8fVwm_UqWUsTdo1U-kE8K1tq_0NH3fjAjZPQdkihOFxkeC0V_s0_Dt8AhA3sVbZJa9IYsoRjiq6_okCvWmsWhVbvo8YA"/>
<!-- If no image, fallback icon -->
<div class="hidden absolute inset-0 flex items-center justify-center bg-surface-container-low">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" data-icon="person">person</span>
</div>
</div>
<button class="absolute bottom-1 right-1 w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white shadow-md border-2 border-background transition-transform active:scale-90">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<!-- Onboarding Intro Text -->
<div class="text-center mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-2">Halo, Tetangga!</h2>
<p class="font-body-md text-body-md text-on-surface-variant px-4">Lengkapi profilmu agar warga di Pangkalan &amp; Tegalwaru lebih mudah mengenalmu.</p>
</div>
<!-- Form Section -->
<div class="w-full space-y-stack-lg">
<!-- Full Name Input -->
<div class="flex flex-col space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="full_name">Nama Lengkap</label>
<div class="relative">
<input class="w-full h-touch-target px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none font-body-md text-on-background placeholder:text-on-surface-variant/40" id="full_name" placeholder="Contoh: Aditya Pratama" type="text"/>
</div>
</div>
<!-- Display Name Input -->
<div class="flex flex-col space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="display_name">Nama Panggilan</label>
<div class="relative">
<input class="w-full h-touch-target px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none font-body-md text-on-background placeholder:text-on-surface-variant/40" id="display_name" placeholder="Contoh: Adit" type="text"/>
</div>
</div>
<!-- Helper Text -->
<div class="flex items-start space-x-2 px-1">
<span class="material-symbols-outlined text-primary text-body-md mt-0.5" data-icon="info">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Data ini akan tampil di profil publikmu untuk memudahkan interaksi antar warga.</p>
</div>
</div>
<!-- Decorative Element (Organic Shape) -->
<div class="mt-auto pt-12 pb-24 w-full flex justify-center opacity-20 pointer-events-none select-none">
<svg class="animate-float" fill="none" height="100" viewbox="0 0 200 100" width="200" xmlns="http://www.w3.org/2000/svg">
<path class="text-primary" d="M10 80C40 60 70 90 100 70C130 50 160 80 190 60" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
<circle class="text-secondary-container" cx="45" cy="40" fill="currentColor" r="4"></circle>
<circle class="text-primary-fixed-dim" cx="155" cy="30" fill="currentColor" r="6"></circle>
</svg>
</div>
</main>
<!-- Bottom Action Button Container -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent pt-8">
<div class="max-w-md mx-auto">
<button class="w-full h-touch-target bg-primary hover:bg-primary-container text-white font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all duration-300 active:scale-95 group" id="next-btn">
                Simpan &amp; Lanjut
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<script>
        // Micro-interactions
        const inputs = document.querySelectorAll('input');
        const nextBtn = document.getElementById('next-btn');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                // Check if all inputs have values
                const allFilled = Array.from(inputs).every(i => i.value.trim().length > 0);
                if (allFilled) {
                    nextBtn.classList.remove('opacity-50');
                    nextBtn.classList.add('opacity-100');
                } else {
                    // Visual cue but keep it active for better UX (validation usually happens on click)
                }
            });
        });

        nextBtn.addEventListener('click', () => {
            // Visual feedback
            nextBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Menyimpan...
            `;
            setTimeout(() => {
                // Mock transition
                console.log('Profile setup complete');
                window.location.reload(); // Simple refresh for demo
            }, 1500);
        });
    </script>

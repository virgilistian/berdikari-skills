            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

        .bottom-sheet-overlay {
            backdrop-filter: blur(2px);

                Batal
            </button>

<script>
        const openBtn = document.getElementById('open-modal');
        const closeBtn = document.getElementById('close-modal');
        const scrim = document.getElementById('modal-scrim');
        const container = document.getElementById('modal-container');
        const sheet = document.getElementById('bottom-sheet');

        function showModal() {
            container.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        function hideModal() {
            sheet.classList.remove('animate-slide-up');
            sheet.style.transform = 'translateY(100%)';
            sheet.style.transition = 'transform 0.2s ease-in';
            
            scrim.style.opacity = '0';
            scrim.style.transition = 'opacity 0.2s ease-in';

            setTimeout(() => {
                container.classList.add('hidden');
                sheet.style.transform = '';
                sheet.style.transition = '';
                scrim.style.opacity = '';
                scrim.style.transition = '';
                sheet.classList.add('animate-slide-up');
                document.body.classList.remove('overflow-hidden');
            }, 200);
        }

        openBtn.addEventListener('click', showModal);
        closeBtn.addEventListener('click', hideModal);
        scrim.addEventListener('click', hideModal);

        // Simple swipe-to-close logic simulation
        let touchStart = 0;
        sheet.addEventListener('touchstart', (e) => {
            touchStart = e.touches[0].clientY;
        });

        sheet.addEventListener('touchend', (e) => {
            const touchEnd = e.changedTouches[0].clientY;
            if (touchEnd - touchStart > 100) {
                hideModal();
            }
        });
        
        // Auto-show for presentation demonstration
        setTimeout(showModal, 800);
    </script>

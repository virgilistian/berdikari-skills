<script>
        const sheet = document.getElementById('sheet');
        const backdrop = document.getElementById('backdrop');
        const container = document.getElementById('bottom-sheet-container');
        const closeBtn = document.getElementById('close-sheet');
        const applyBtn = document.getElementById('apply-btn');

        function toggleSheet(show) {
            if (show) {
                container.classList.remove('pointer-events-none');
                container.style.display = 'flex';
                requestAnimationFrame(() => {
                    sheet.style.transform = 'translateY(0)';
                    backdrop.style.opacity = '1';
                });
            } else {
                sheet.style.transform = 'translateY(100%)';
                backdrop.style.opacity = '0';
                setTimeout(() => {
                    container.style.display = 'none';
                    container.classList.add('pointer-events-none');
                }, 300);
            }
        }

        // Handle clicks
        closeBtn.addEventListener('click', () => toggleSheet(false));
        backdrop.addEventListener('click', () => toggleSheet(false));
        applyBtn.addEventListener('click', () => {
            const selected = document.querySelector('input[name="sort_option"]:checked');
            console.log('Sorting applied:', selected ? selected.value : 'none');
            toggleSheet(false);
        });

        // Touch handling for "drag to dismiss" feeling
        let startY = 0;
        let currentY = 0;

        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) {
                sheet.style.transform = `translateY(${diff}px)`;
                backdrop.style.opacity = 1 - (diff / sheet.offsetHeight);
            }
        });

        sheet.addEventListener('touchend', (e) => {
            const diff = currentY - startY;
            if (diff > 100) {
                toggleSheet(false);
            } else {
                sheet.style.transform = 'translateY(0)';
                backdrop.style.opacity = '1';
            }
            startY = 0;
            currentY = 0;
        });
        
        // Expose to global for potential testing/triggers
        window.openSortSheet = () => toggleSheet(true);
    </script>

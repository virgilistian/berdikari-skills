<body class="bg-background text-on-background min-h-screen font-body-md flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-background flex items-center px-margin-mobile h-touch-target">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 mr-2">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Daftar Akun</h1>
</header>
<main class="flex-grow pt-20 px-margin-mobile pb-10 max-w-md mx-auto w-full">
<!-- Hero Section -->
<div class="mb-stack-lg">
<div class="w-full aspect-video rounded-xl overflow-hidden mb-stack-md custom-shadow">
<img class="w-full h-full object-cover" data-alt="A warm and inviting illustration of a local neighborhood market scene in Indonesia, featuring friendly characters interacting in a clean, modern corporate artistic style. The color palette uses soft greens and warm earthy browns with plenty of white space. The lighting is bright and cheerful, suggesting a fresh morning start for the community." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqS0A-LNMxUcREh0BC-UFkjBzbrX_9Fef-bTAimSg6CRGfKe1ZfSoFZmo5foqS4_dBpWsDr15HSoaAxtT8vGJC8ocoitBXpx84GSCUG_Tz7DO_yaRZlHB3FxWegxc59gpMBoelLL5spcC9iUAiN7BUxGE04JFxD-YGMtTkYnB0mHJ00-IeHHr75JnqkEToWY3ON98TtsMG8BmaaXNZbzOsH86r38P4vjeAJnMByiVW5abfSPb2Vy32eA"/>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-base">Selamat Datang, Tetangga!</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Bergabunglah dengan komunitas kami untuk kemudahan akses layanan lokal di Pangkalan dan Tegalwaru.</p>
</div>
<!-- Registration Form -->
<form class="space-y-stack-md" id="registrationForm">
<!-- Full Name Input -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="fullName">Nama Lengkap</label>
<div class="relative group">
<input class="w-full h-touch-target px-4 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline font-body-md" id="fullName" name="fullName" placeholder="Masukkan nama sesuai KTP" required="" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="phoneNumber">Nomor Handphone</label>
<div class="relative group">
<input class="w-full h-touch-target px-4 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline font-body-md" id="phoneNumber" name="phoneNumber" placeholder="Contoh: 081234567890" required="" type="tel"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">call</span>
</div>
<p class="text-[11px] text-tertiary-container mt-1 ml-1 italic">Pastikan nomor kamu aktif untuk verifikasi.</p>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-3 py-2">
<div class="relative flex items-center h-touch-target">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary transition-colors cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-md text-on-surface-variant pt-3 cursor-pointer select-none" for="terms">
                    Saya menyetujui <a class="text-primary font-semibold hover:underline" href="#">Syarat &amp; Ketentuan</a> serta <a class="text-primary font-semibold hover:underline" href="#">Kebijakan Privasi</a> yang berlaku.
                </label>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-touch-target bg-primary text-on-primary font-label-lg text-label-lg rounded-full shadow-md active:scale-95 transition-all duration-150 hover:bg-primary-container flex items-center justify-center gap-2" type="submit">
                    Daftar Sekarang
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-on-surface-variant">
                Sudah punya akun? 
                <a class="text-secondary font-bold hover:text-secondary-container transition-colors ml-1 underline underline-offset-4" href="#">Masuk di sini</a>
</p>
</div>
<!-- Decorative Element -->
<div class="mt-12 flex justify-center opacity-20">
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
</div>
</div>
</main>
<!-- Script for subtle interaction -->
<script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Memproses...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Berhasil!';
                btn.classList.replace('bg-primary', 'bg-tertiary');
                
                // Simulate redirect
                setTimeout(() => {
                    alert('Terima kasih sudah mendaftar! Kamu akan diarahkan ke halaman utama.');
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary', 'bg-primary');
                    btn.classList.remove('opacity-80', 'cursor-not-allowed');
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        });

        // Basic phone number formatting helper
        const phoneInput = document.getElementById('phoneNumber');
        phoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>

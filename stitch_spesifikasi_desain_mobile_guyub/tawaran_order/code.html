<!-- Micro-interactions Script -->
<script>
        let timeLeft = 30;
        const totalTime = 30;
        const progressCircle = document.getElementById('progress');
        const timerText = document.getElementById('timer-text');
        const circumference = 2 * Math.PI * 44;

        const interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(interval);
                timeLeft = 0;
                handleSkip(); // Auto skip when time is up
            }

            timerText.innerText = timeLeft;
            
            // Calculate progress offset
            const offset = circumference - (timeLeft / totalTime) * circumference;
            progressCircle.style.strokeDashoffset = offset;

            // Change color to warning if low
            if (timeLeft < 10) {
                progressCircle.classList.remove('text-secondary');
                progressCircle.classList.add('text-error');
            }
        }, 1000);

        function handleAccept() {
            // Add success vibration/feedback animation
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Memproses...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Order Berhasil Diterima! Menuju Navigasi...');
            }, 800);
        }

        function handleSkip() {
            // Visual fade out logic
            document.querySelector('.relative.z-10').style.opacity = '0.5';
            document.querySelector('.relative.z-10').style.transform = 'scale(0.95)';
            document.querySelector('.relative.z-10').style.transition = 'all 0.3s ease';
            
            setTimeout(() => {
                alert('Order dilewati.');
            }, 300);
        }
    </script>

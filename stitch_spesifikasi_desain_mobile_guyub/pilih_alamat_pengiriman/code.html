<body class="font-body-md text-on-surface antialiased">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full bg-background flex items-center px-margin-mobile h-touch-target z-50">
<button aria-label="Kembali" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-md text-headline-md text-primary">Pilih Alamat Pengiriman</h1>
</header>
<main class="pt-touch-target pb-32 min-h-screen">
<!-- Map Section -->
<section class="relative w-full h-[320px] md:h-[400px] overflow-hidden">
<div class="w-full h-full bg-surface-container" data-alt="A detailed digital map view of the Pangkalan and Tegalwaru rural area, Karawang. The map shows simplified street layouts with lush green patches representing rice fields and local settlements. A central red location pin is placed precisely in a residential cluster. The visual style is clean and corporate modern, with soft pastels and a friendly neighborhood market vibe." data-location="Pangkalan, Karawang, Indonesia" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuApVB7CN0ReYbB42Rd8IHc1gQNWOvBYqoXEnXZS333Y32oI8wu2msRqVi3mwSb-dogG5aFdj1sjxsLfO25lXaVxP7IIBygC-Nm1LlgYYP5dSLrWhLk1cclvfRb-3kxnHGfqi9ndpWTshuvFrFND0Z4JQP1nh-R1A-8gZTy2tFd8YhiZzU8UZvwBozilDLiuTMma_0xRiOeK5y0Pbo_wnpOOpZPfR6oy45ouXwx-R0YOfVlHGO4V2ur82A')">
</div>
<!-- Map Overlay Controls -->
<div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4">
<div class="self-end pointer-events-auto">
<button class="bg-surface shadow-sm p-3 rounded-xl flex items-center justify-center hover:bg-surface-container-high active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">fullscreen</span>
</button>
</div>
<!-- Central Pin Animation Placeholder -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="w-4 h-1 bg-on-surface/20 rounded-full blur-[1px] mt-[-4px]"></div>
</div>
<!-- Floating Button: Gunakan Lokasi Saat Ini -->
<button class="pointer-events-auto mx-auto mb-4 bg-primary text-on-primary px-6 py-3 rounded-full flex items-center gap-2 shadow-lg hover:bg-primary-container transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="font-label-lg text-label-lg">Gunakan Lokasi Saat Ini</span>
</button>
</div>
</section>
<!-- Addresses List Section -->
<section class="px-margin-mobile mt-stack-lg">
<div class="flex items-center justify-between mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Alamat Saya</h2>
</div>
<div class="space-y-stack-md">
<!-- Address Card: Rumah -->
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl shadow-sm cursor-pointer hover:border-primary transition-colors group">
<div class="flex gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex-grow">
<div class="flex items-center justify-between">
<span class="font-label-lg text-label-lg text-on-surface">Rumah</span>
<span class="material-symbols-outlined text-primary opacity-0 group-hover:opacity-100 transition-opacity">check_circle</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Krajan, RT 02/01, depan Mushola</p>
</div>
</div>
</div>
<!-- Address Card: Kantor -->
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl shadow-sm cursor-pointer hover:border-primary transition-colors group">
<div class="flex gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 group-hover:bg-primary group-hover:text-on-primary transition-colors">

</div>
<div class="flex-grow">
<div class="flex items-center justify-between">
<span class="font-label-lg text-label-lg text-on-surface">Kantor</span>

</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Jl. Raya Pangkalan No. 12</p>
</div>
</div>
</div>

<div class="flex items-center gap-2 py-4 opacity-50 justify-center">
<div class="h-[1px] bg-outline-variant flex-grow"></div>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Alamat Tersimpan Lainnya</span>
<div class="h-[1px] bg-outline-variant flex-grow"></div>
</div>
</div>

</main>
<!-- Bottom Action Section -->
<footer class="fixed bottom-0 left-0 w-full bg-surface shadow-[0_-4px_20px_0_rgba(0,0,0,0.05)] px-margin-mobile py-4 z-50">
<button class="w-full bg-surface-container-lowest border-2 border-dashed border-primary text-primary font-headline-md text-headline-md h-14 rounded-xl flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined">add</span>
            Tambah Alamat Baru
        </button>
</footer>
<!-- Interaction Script -->
<script>
        document.querySelectorAll('.cursor-pointer').forEach(card => {
            card.addEventListener('click', function() {
                // Remove active state from all
                document.querySelectorAll('.cursor-pointer').forEach(c => {
                    c.classList.remove('border-primary', 'bg-primary-fixed/20');
                    c.querySelector('.material-symbols-outlined[style*="FILL"]').parentElement.classList.replace('bg-primary', 'bg-primary-fixed');
                    c.querySelector('.material-symbols-outlined[style*="FILL"]').parentElement.classList.replace('text-on-primary', 'text-primary');
                });
                
                // Add to current
                this.classList.add('border-primary');
            });
        });
    </script>

# GUYUB T0 production stack (PRD §25.1-§25.2). Run from the `infra/`
# directory: `docker compose -f docker-compose.prod.yml up -d`.
#
# Postgres is NOT here on purpose — T0 uses a managed instance with PITR
# (PRD §25.1). Object storage is S3-compatible and external too. Everything
# below reads its secrets from a sibling `.env` file — see README.md for the
# mandatory variable list. Nothing here is a container-local secret.
#
# `api` runs php-fpm (4 static workers, docker/php/fpm-pool.conf in
# berdikari-api), not `artisan serve` — that's a local-dev-only convenience
# from docker/entrypoint.sh. Migrations are a deliberate one-off step, not
# run automatically on container start (see README.md "Deploy").

services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../berdikari-api
      dockerfile: Dockerfile
    entrypoint: ["php-fpm", "-F"]
    restart: unless-stopped
    depends_on:
      - redis
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: guyub
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  worker:
    build:
      context: ../berdikari-api
      dockerfile: Dockerfile
    entrypoint: ["php", "artisan", "queue:work", "--tries=1", "--timeout=90"]
    restart: unless-stopped
    depends_on:
      - api
      - redis
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: guyub
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  scheduler:
    build:
      context: ../berdikari-api
      dockerfile: Dockerfile
    entrypoint: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      - api
      - redis
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: guyub
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  redis_data:

# T0 (PRD §25.1): TLS terminates at Cloudflare, this nginx only serves plain
# HTTP behind it. FastCGI straight to the `api` service's php-fpm (port
# 9000) — unlike local dev, which proxies HTTP to `artisan serve`.
#
# No shared code volume with `api` on purpose: this nginx is API-only (pure
# JSON), uploads go straight to object storage (PRD §25.1), and there are no
# static files to serve from the filesystem here — every request goes
# through Laravel's front controller. SCRIPT_FILENAME is a FastCGI protocol
# parameter, not a local nginx path, so this is safe without a mount.
server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    location / {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
